# Scripted conversations against the plugin (evals/), run by `claude plugin eval`: 3 runs per case, plus a no-plugin
# baseline arm (the default ablation) so the score shows what the plugin adds. Manual only: every run
# calls Claude and costs money. Needs the ANTHROPIC_API_KEY repository secret; without it the job is skipped.
# Action pins verified 2026-10-13 with `git ls-remote` against the tags named in the comments.
name: plugin-evals
on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case name glob (blank = all)"
        required: false
        default: "*"
permissions:
  contents: read
jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without the API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::ANTHROPIC_API_KEY secret not set; evals skipped."
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.ANTHROPIC_API_KEY != ''
        with:
          persist-credentials: false
      - name: Install Claude Code 2.1.296 (exact version)
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Run the eval suite
        if: env.ANTHROPIC_API_KEY != ''
        env:
          CASE: ${{ inputs.case }}
        # The cases are ours: --scaffold copies examples/demo-athlete into each run's folder.
        run: >
          claude plugin eval . --case "$CASE" --runs 3 --scaffold --trust-plugin
          --allow-tools Bash Write Edit --no-publish --max-cost-usd 30
          --output-dir eval-results --report eval-results/report.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.ANTHROPIC_API_KEY != ''
        with:
          name: eval-results
          path: eval-results/
