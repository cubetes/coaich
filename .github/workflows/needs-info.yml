# Closes an issue 14 days after it was labelled `needs-info` with no reply. Nothing else is ever closed for age.
# Action pin verified 2026-10-12 with `git ls-remote` against the tag named in the comment.
name: needs-info
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  issues: write
jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-labels: needs-info
          days-before-stale: 0
          days-before-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: needs-info
          remove-stale-when-updated: true
          close-issue-message: >-
            Closed because the information asked for didn't arrive in 14 days. Reply with it and the issue
            will be reopened.
