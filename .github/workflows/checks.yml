# Pre-publish checks on every push and pull request. No secrets, no pull_request_target, read-only token.
# Action pins verified 2026-10-11 with `git ls-remote` against the tags named in the comments.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the scanners read the whole history
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-pinned)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks && rm gitleaks.tgz
      - name: Duplicates, image metadata, real-data guard, gitleaks
        run: tools/checks.sh
      - name: trufflehog (verified secrets only)
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified
