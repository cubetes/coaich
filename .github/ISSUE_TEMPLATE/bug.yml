name: Bug
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real health data, body measurements, your athlete folder or photos.** Reproduce it with
        `examples/demo-athlete`, or describe the values in words. Search existing issues first and add a 👍 there
        instead of opening a duplicate.
  - type: input
    id: version
    attributes:
      label: CoAIch version
      description: From `plugin/.claude-plugin/plugin.json`, or the app's settings screen.
      placeholder: 0.5.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Where it runs
      description: Claude Code version and operating system, or iPhone / Apple Watch model and OS version.
      placeholder: Claude Code 2.x on macOS 27
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a fresh start, using the demo athlete if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste errors as text in a code block, not as a screenshot. Remove anything personal first.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real health data, measurements or photos.
          required: true
