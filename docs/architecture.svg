<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" width="960" height="496" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">CoAIch: the plugin is the brain</title>
<desc id="arch-desc">The CoAIch plugin is the brain and runs on your own computer, in Claude Code today and in OpenAI Codex or Google Gemini CLI later. The iPhone and Apple Watch apps (alpha) and the web app (planned) record sets, sessions and adherence, read Apple Health and show your plans. Your data goes to the Claude Code plugin on your own computer through a link you choose: a file, a server on your own computer or on your own Cloudflare account (one person per server), or later CoAIch Pro servers. The plugin coaches and sends the plans back the same way. Without the apps, it imports from Strong or Hevy.</desc>
